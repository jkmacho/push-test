<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BiApp · prueba de avisos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#0f1520">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root{--bg:#0f1520;--panel:#131e33;--line:#22385a;--text:#e4e8f0;--dim:#8b98b3;--brand:#14b8a6;--brand-hi:#68ded0}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(20px,env(safe-area-inset-top)) 18px 40px}
  main{max-width:480px;margin:0 auto}
  h1{font-size:1.4rem;margin:0 0 4px} p{color:var(--dim);margin:0 0 14px}
  button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:13px 16px;background:var(--brand);color:#06201c;width:100%;cursor:pointer;margin:6px 0}
  button.sec{background:transparent;color:var(--brand-hi);border:1px solid var(--line)}
  button:disabled{opacity:.5}
  button:focus-visible{outline:2px solid var(--brand-hi);outline-offset:2px}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:12px 0;font-size:.9rem}
  .box b{color:var(--text)} .ok{color:var(--brand-hi)} .ko{color:#f2a93c}
  textarea{width:100%;height:130px;background:#0a0f16;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
</style>
</head>
<body>
<main>
  <h1>BiApp · prueba de avisos</h1>
  <p>Página de prueba, sin datos.</p>

  <div class="box" id="estado">Comprobando…</div>

  <button id="activar" disabled>Activar avisos</button>
  <button id="probar" class="sec" disabled>Aviso local de prueba</button>

  <div id="salida" hidden>
    <p>Copia esto y pásamelo (es la suscripción de este móvil; no contiene contraseñas):</p>
    <textarea id="sub" readonly></textarea>
    <button id="copiar" class="sec">Copiar</button>
  </div>
</main>

<script>
// Clave pública VAPID (la imprime genera_vapid.py). Es pública: puede ir en el código.
var VAPID_PUBLIC = 'BEzGZZDOm_SkaRGkAQU5L_BBnNgEND0ieHbsxPBnbQDxeiPNJnaisbFCWpVG8KoNEujYLO3NYGEhMlE_MKkEIjw';

var $ = function (id) { return document.getElementById(id); };
function msg(html, cls) { $('estado').innerHTML = '<span class="' + (cls || '') + '">' + html + '</span>'; }
function b64ToBytes(s) {
  var p = '='.repeat((4 - s.length % 4) % 4), b = (s + p).replace(/-/g, '+').replace(/_/g, '/');
  var raw = atob(b), out = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}

var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
var soporta = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
var reg = null;

(async function init() {
  if (ios && !standalone) {
    msg('En iPhone hay que <b>añadir esta página a la pantalla de inicio</b> (Compartir → «Añadir a pantalla de inicio») y abrirla desde ese icono. Requiere iOS 16.4 o superior.', 'ko');
    return;
  }
  if (!soporta) { msg('Este navegador no soporta avisos push.', 'ko'); return; }
  if (!window.isSecureContext) { msg('Hace falta HTTPS.', 'ko'); return; }
  try {
    reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    var s = await reg.pushManager.getSubscription();
    $('activar').disabled = false;
    $('probar').disabled = Notification.permission !== 'granted';
    msg(s ? 'Ya suscrito. Permiso: ' + Notification.permission : 'Listo. Permiso: ' + Notification.permission, s ? 'ok' : '');
    if (s) mostrar(s);
  } catch (e) { msg('Error registrando el service worker: ' + e.message, 'ko'); }
})();

function mostrar(s) { $('sub').value = JSON.stringify(s); $('salida').hidden = false; }

$('activar').addEventListener('click', async function () {
  if (VAPID_PUBLIC.indexOf('PON_AQUI') === 0) { msg('Falta poner la clave pública VAPID en index.html.', 'ko'); return; }
  try {
    var perm = await Notification.requestPermission();
    if (perm !== 'granted') { msg('Permiso denegado (' + perm + ').', 'ko'); return; }
    var s = await reg.pushManager.getSubscription() ||
            await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID_PUBLIC) });
    $('probar').disabled = false;
    mostrar(s);
    msg('Suscrito. Pasa la suscripción para enviar un aviso desde el servidor.', 'ok');
  } catch (e) { msg('No se pudo suscribir: ' + e.message, 'ko'); }
});

$('probar').addEventListener('click', function () {
  reg.showNotification('BiApp · aviso local', { body: 'Si ves esto, las notificaciones del sistema funcionan.', icon: 'icons/icon-192.png', tag: 'local' });
});

$('copiar').addEventListener('click', function () {
  $('sub').select();
  try { navigator.clipboard.writeText($('sub').value); } catch (_) { document.execCommand('copy'); }
});
</script>
</body>
</html>
